[package]
name = "argon2-cloudflare"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2 = "0.5.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
worker = "0.7.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
